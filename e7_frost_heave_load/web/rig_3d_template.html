<title>Sestava E7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: workshop sheet – viewer left, parts list with suppliers right; stacks on phones */
:root {
  --bg: #eef1f2; --panel: #ffffff; --ink: #16202a; --ink-2: #55626e; --rule: #d3d9dd;
  --accent: #0f6f8f; --accent-soft: #dcecf2; --hi: #e0790b; --stage: #dfe5e8;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171c; --panel: #182129; --ink: #e6ecef; --ink-2: #9daab4; --rule: #2b3640;
    --accent: #5fb7d4; --accent-soft: #19323d; --hi: #f39a3a; --stage: #1b252d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171c; --panel: #182129; --ink: #e6ecef; --ink-2: #9daab4; --rule: #2b3640;
  --accent: #5fb7d4; --accent-soft: #19323d; --hi: #f39a3a; --stage: #1b252d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); margin: 0; }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 18px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { font: 600 22px/1.2 var(--f-body); margin: 0; text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 13px; }
.phase { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--panel); }
.phase button { font: 500 13px var(--f-body); color: var(--ink); background: transparent; border: 0; padding: 7px 12px; cursor: pointer; }
.phase button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.phase button + button { border-left: 1px solid var(--rule); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
.stage { position: relative; background: var(--stage); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden;
  height: min(80vh, 780px); min-height: 380px; max-width: 100%; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.bar { position: absolute; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.bar button, .chips button { font: 500 12px var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--rule);
  border-radius: 5px; padding: 5px 9px; cursor: pointer; }
.bar button:hover, .chips button:hover { border-color: var(--accent); }
.orb { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--rule); border-radius: 5px; padding: 2px 8px 2px 2px; font-size: 12px; }
.orb[hidden] { display: none; }
.orb button { border: 0; }
.orb input { width: 120px; vertical-align: middle; accent-color: var(--accent); }
.orb output { font: 12px var(--f-mono); display: inline-block; min-width: 3.2em; text-align: right; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.info { position: absolute; left: 10px; bottom: 10px; right: 10px; background: var(--panel); border: 1px solid var(--rule);
  border-radius: 6px; padding: 8px 10px; font-size: 13px; }
.info b { font-weight: 600; }
.info .m { font: 12px var(--f-mono); color: var(--ink-2); }
.load { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-2); font-size: 13px; }
aside { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 12px 6px; min-width: 0; }
aside h2 { font: 600 14px var(--f-body); margin: 0 0 6px; }
.grp { border-top: 1px solid var(--rule); padding: 8px 0; }
.grp:first-of-type { border-top: 0; }
.ghead { display: flex; align-items: center; gap: 8px; }
.ghead label { font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.who { color: var(--ink-2); font-size: 12px; margin: 2px 0 4px 26px; }
.parts { list-style: none; margin: 0; padding: 0 0 0 20px; display: grid; gap: 1px; }
.parts button { all: unset; display: block; width: 100%; box-sizing: border-box; padding: 3px 6px; border-radius: 4px; cursor: pointer;
  font-size: 12.5px; }
.parts button:hover { background: var(--accent-soft); }
.parts button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.parts button:focus-visible { outline: 2px solid var(--accent); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.fact { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; }
.fact .v { font: 600 16px var(--f-mono); font-variant-numeric: tabular-nums; }
.fact .l { color: var(--ink-2); font-size: 12px; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } .stage { height: min(75vh, 560px); } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="wrap">
  <header>
    <h1>Sestava E7</h1>
    <div class="phase" role="group" aria-label="Fáze experimentu">
      <button id="phU" aria-pressed="true">Fáze 1 – bez zatížení</button><button id="phC" aria-pressed="false">Fáze 2 – se zátěží</button>
    </div>
    <span class="sub" id="sub"></span>
  </header>

  <div class="facts" id="facts"></div>

  <div class="main">
    <div class="stage">
      <canvas id="view" aria-label="3D model sestavy E7, otáčení tažením, zoom kolečkem"></canvas>
      <div class="load" id="load">Načítám model…</div>
      <div class="bar">
        <button id="vIso">Pohled 3D</button><button id="vFront">Zepředu</button><button id="vSide">Z boku</button><button id="vTop">Shora</button>
        <button id="vAll">Zobrazit vše</button>
        <span id="orb" class="orb" hidden><button id="oPlay" aria-pressed="false">▶ Oběh kamery</button>
          <label>úhel <input id="oAng" type="range" min="-180" max="180" step="1" value="0"> <output id="oVal">0°</output></label></span>
      </div>
      <div class="info" id="info"><b>Klikněte na díl</b> v modelu nebo v seznamu – zvýrazní se a ukáže se, kde ho koupit. Tažením otáčíte, kolečkem / dvěma prsty přibližujete.</div>
    </div>
    <aside aria-label="Díly sestavy">
      <h2>Díly a dodavatelé</h2>
      <div id="groups"></div>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const GLB = { u: "/*__GLB_U__*/", c: "/*__GLB_C__*/" };
const PHASE = {
  u: { sub: "rám z T-profilů · cela ⌀220 × 171 s rovným čelem · celý povrch volný · kamera OBÍHÁ kolem vzorku ±180° · laser 11 čar · invarový terčík",
       facts: [["480 mm", "výška sestavy nad dnem mrazáku (s boxem RPi)"], ["340 × 320 mm", "půdorys rámu (nohy ±150 / ±140)"],
               ["0 kPa", "bez zatížení – měří se celý povrch ⌀100"], ["36 snímků / oběh", "3D model povrchu z jednoho oběhu (10°), laser ve výchozí poloze ≈ 10 µm"]] },
  c: { sub: "stejný rám, kamera a laser · cela ⌀220 × 200 s límcem · zátěž na pístu ⌀50 · LVDT na invarovém sloupku",
       facts: [["559 mm", "výška sestavy nad dnem mrazáku"], ["340 × 320 mm", "půdorys rámu (nohy ±150 / ±140)"],
               ["5–25 kPa", "zatížení pod pístem ⌀50 (0–4 kotouče)"], ["≈ 1 µm / 10 µm", "rozlišení LVDT / laseru s kamerou"]] },
};
// groups: [id, label, supplier text, colour, matcher]
const GROUPS = [
  ["frame", "Rám z T-profilů", "ENPRAG, s.r.o., Praha 5 – profily nařezané podle výkresů T01–T04, úhelníky, T-matice, nohy", "#9aa3ab",
   n => /^(T0\d|angle bracket|levelling foot)/.test(n)],
  ["cell", "Cela a vzorek", "cela: vlastní 3D tisk (PETG-CF, Prusa) · G10: Elektroizolanty Praha · písek a čidla bodu M: máte", "#c9a86a",
   n => /^(cell|unsaturated sand|G10|M )/.test(n)],
  ["load", "Zátěž a vedení", "kotouče a píst: laser grupol.cz (DXF) · Invar: Kovohutě Rokycany · igus: HENNLICH · kroužek, kulička: Fabory / cyklo", "#6f7c8a",
   n => /^(L0\d|steel ball|guide rod|shaft collar|igus|P01)/.test(n)],
  ["meas", "Měření", "laser: Picotronic · kamera + RPi: RPishop.cz · LED: TME / GME · Invar: Kovohutě Rokycany · LVDT (fáze 2): Elkome · tištěné díly: vlastní tisk", "#d1873a",
   n => /^(LVDT|Invar 36 post|P0[2-8]|line laser|LED)/.test(n)],
  ["orbit", "Oběh kamery", "Camera Module 3 + kabel 500 mm: RPishop.cz · motor 28BYJ-48 + ULN2003, Hall: GME / LaskaKit · ložiska 6001-2RS: TME / ZKL · hřídel ⌀12 h6: HENNLICH / TME · tištěné díly: vlastní tisk", "#3d7fb8",
   n => /^(P1[2-9]|shaft|stepper|bearing 6001|Raspberry Pi Camera|P06 box with RPi)/.test(n)],
];
// [prefix of model name, Czech name, where to buy]
const CZ = [
  ["T02", "T02 základní nosník 40×40 × 320", "profil 40×40, drážka 8, nařezaný na 320 mm – ENPRAG"],
  ["levelling", "stavitelná noha M8", "noha M8 do závitu v čele profilu – ENPRAG"],
  ["T03", "T03 příčka 40×80 × 260", "profil 40×80, nařezaný na 260 mm – ENPRAG"],
  ["angle bracket 40 base", "úhelník 40 – základna", "úhelník 40, drážka 8 + T-matice M8 – ENPRAG"],
  ["T01", "T01 sloup 40×80 × 306", "profil 40×80, nařezaný na 306 mm – ENPRAG"],
  ["angle bracket 40 slot", "úhelník 40 – sloupy", "úhelník 40, drážka 8 + T-matice M8 – ENPRAG"],
  ["T04", "T04 horní nosník 40×80 × 340, otvor ⌀14", "profil 40×80 × 340 mm, otvor ⌀14 vyvrtá ENPRAG podle výkresu T04"],
  ["G10", "podložka G10 ⌀20 × 40", "tyč sklotextit G10 ⌀20, nařezat 3 × 40 mm – Elektroizolanty Praha"],
  ["cell PETG D220x171", "cela ⌀220 × 171, rovné čelo (3D tisk, E7-V03u)", "fáze 1: vlastní tisk PETG-CF, ≈ 1,1 kg filamentu – Prusa Research; čelo jen 5 mm nad pískem, kamera vidí celý povrch"],
  ["cell", "cela ⌀220 × 200 s límcem (3D tisk, E7-V03)", "fáze 2: vlastní tisk PETG-CF, ≈ 1,3 kg filamentu – Prusa Research"],
  ["unsaturated", "vzorek písku ⌀100 × 100", "písek – máte (Sr 0,5)"],
  ["M TDR CS645 head", "TDR CS645 – hlava", "máte (Campbell, servis Ekotechnika)"],
  ["M TDR CS645 rod", "TDR CS645 – tyčky", "máte (Campbell, servis Ekotechnika)"],
  ["M optical fibre", "optické vlákno", "máte"],
  ["M Pt100 metal", "Pt100 – sonda", "máte"],
  ["M Pt100 cable", "Pt100 – kabel", "máte"],
  ["P01", "P01 pouzdro ložiska (tisk)", "vlastní 3D tisk"],
  ["igus", "kluzné pouzdro igus RJ4JP-01-12", "HENNLICH (zastoupení igus) nebo TME"],
  ["L05", "L05 píst spodní ⌀50 × 10", "Al 10 mm, laserový řez podle DXF – grupol.cz"],
  ["L04", "L04 píst horní ⌀50 × 10", "Al 10 mm, laserový řez podle DXF – grupol.cz"],
  ["steel ball", "ocelová kulička 5/16\"", "kuličky do ložisek – cyklo prodejna / Fabory CZ"],
  ["guide rod", "vodicí tyč Invar ⌀12 × 265", "Invar 36 ⌀12 h9 – Kovohutě Rokycany (nařežou)"],
  ["shaft collar", "stavěcí kroužek DIN 705 ⌀12", "Fabory CZ / Hornbach"],
  ["L03", "L03 nosná deska ⌀140 × 10", "Al 10 mm, laserový řez – grupol.cz"],
  ["L06", "L06 závaží 1 kg ⌀117,5 × 12", "ocel S235 12 mm, laserový řez – grupol.cz"],
  ["P04", "P04 patka sloupku (tisk)", "vlastní 3D tisk"],
  ["Invar 36 post", "sloupek Invar ⌀16 × 330", "Invar 36 ⌀16 – Kovohutě Rokycany (nařežou)"],
  ["P02", "P02 rameno LVDT (tisk)", "vlastní 3D tisk"],
  ["LVDT RDP", "LVDT RDP DCTH400AG ±10 mm", "Elkome (zastoupení RDP pro ČR) – poptávka"],
  ["LVDT plunger", "jádro LVDT", "součást LVDT"],
  ["P03", "P03 rameno s invarovým terčíkem (tisk)", "vlastní 3D tisk; obchází celu zvenku, terčík na straně kamery – reference posunu rámu"],
  ["LED", "bílá LED 1 W na hvězdě ⌀20 (fotky povrchu)", "TME / GM electronic; na hlavě vedle okénka, spíná RPi (GPIO27)"],
  ["P06 box with RPi", "P06 box s RPi 5 (ve vaničce na příčníku)", "RPi 5 – RPishop.cz, box vlastní 3D tisk"],
  ["P06", "P06 box kamery: RPi 5 + HQ kamera + objektiv 6 mm", "elektronika RPishop.cz, box vlastní 3D tisk"],
  ["P12", "P12 ložiskový blok na příčníku (tisk)", "vlastní 3D tisk; 2× ložisko 6001-2RS, 4× M5 do horních drážek T04"],
  ["P14", "P14 rameno s nábojem a hlavou kamery (tisk)", "vlastní 3D tisk; na hřídeli ⌀12 dvěma červíky M4, obíhá ±180°"],
  ["P15", "P15 víčko hlavy (tisk)", "vlastní 3D tisk"],
  ["P16", "P16 stojánek motoru (tisk)", "vlastní 3D tisk; Hall senzor A3144 pro výchozí polohu"],
  ["P17", "P17 ozubené kolo m1 z72 (tisk)", "vlastní 3D tisk; magnet ⌀6 × 2 pro výchozí polohu"],
  ["P18", "P18 vanička boxu RPi (tisk)", "vlastní 3D tisk"],
  ["P19", "P19 pastorek m1 z12 (tisk)", "vlastní 3D tisk; převod 6 : 1"],
  ["shaft collar DIN 705-A 12 (orbit)", "stavěcí kroužek DIN 705 ⌀12 (oběh)", "Fabory CZ / Hornbach; hřídel na něm visí"],
  ["shaft D12", "hřídel ⌀12 h6 × 120", "kalená broušená tyč – HENNLICH / TME / e-shopy s díly pro 3D tiskárny"],
  ["stepper", "krokový motor 28BYJ-48 5 V + ULN2003", "GM electronic / LaskaKit"],
  ["bearing 6001", "ložisko 6001-2RS (12 × 28 × 8)", "TME nebo ZKL (český výrobce)"],
  ["Raspberry Pi Camera", "Raspberry Pi Camera Module 3", "RPishop.cz; 66° × 41°, kabel Standard–Mini 500 mm"],
  ["P08", "P08 závěs kamery (tisk)", "vlastní 3D tisk; kamera 110 mm nad pískem, sklon 38°"],
  ["P05", "P05 držák laseru (tisk)", "vlastní 3D tisk"],
  ["line laser", "laser Picotronic DOE253, 11 čar", "Picotronic GmbH (dle cenové nabídky)"],
];
const cz = n => CZ.find(c => n.startsWith(c[0])) || [n, n, ""];
const canvas = document.getElementById("view"), stage = canvas.parentElement;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 1, 10000);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a929a, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(500, 900, 700); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(-600, 300, -500); scene.add(fill);

function bg() { scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--stage").trim() || "#dfe5e8"); }
bg(); matchMedia("(prefers-color-scheme: dark)").addEventListener("change", bg);
new MutationObserver(bg).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);

const parts = []; let center = new THREE.Vector3(), radius = 400, selected = null, hiMat = null;
function nameOf(o) { while (o && o.parent) { if (/^E7/.test(o.parent.name || "")) return o.name.replace(/_/g, " "); o = o.parent; } return ""; }

let root = null, pivot = null, axis = null, playing = false, orbAng = 0, orbDir = 1;
const ROT = /^(shaft D12|shaft collar DIN 705-A 12 \(orbit\)|P17 |P14 |P15 |Raspberry Pi Camera Module 3|LED white 1 W)/;
function setOrbit(deg) {
  orbAng = deg; document.getElementById("oAng").value = Math.round(deg); document.getElementById("oVal").textContent = Math.round(deg) + "°";
  if (pivot && axis) pivot.quaternion.setFromAxisAngle(axis, deg * Math.PI / 180);
}
function buildPivot() {
  pivot = null; axis = null;
  let asmNode = null; const nodes = [];
  root.traverse(o => { if (!asmNode && /^E7/.test(o.name || "") && o.children.length > 5) asmNode = o; });
  if (!asmNode) return;
  for (const c of [...asmNode.children]) if (ROT.test((c.name || "").replace(/_/g, " "))) nodes.push(c);
  if (!nodes.length) return;
  const shaft = nodes.find(c => /^shaft D12/.test(c.name.replace(/_/g, " "))) || nodes[0];
  root.updateMatrixWorld(true);
  const inv = asmNode.matrixWorld.clone().invert();
  const bb = new THREE.Box3().setFromObject(shaft).applyMatrix4(inv), s = bb.getSize(new THREE.Vector3());
  axis = s.z >= s.y && s.z >= s.x ? new THREE.Vector3(0, 0, 1) : (s.y >= s.x ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0));
  pivot = new THREE.Group(); asmNode.add(pivot);
  for (const n of nodes) pivot.attach(n);
}
function load(ph) {
  document.getElementById("phU").setAttribute("aria-pressed", ph === "u");
  document.getElementById("phC").setAttribute("aria-pressed", ph === "c");
  document.getElementById("sub").textContent = PHASE[ph].sub;
  document.getElementById("facts").innerHTML = PHASE[ph].facts.map(f => `<div class="fact"><div class="v">${f[0]}</div><div class="l">${f[1]}</div></div>`).join("");
  if (root) { scene.remove(root); root = null; }
  parts.length = 0; document.getElementById("groups").innerHTML = ""; select(null);
  const ld = document.getElementById("load"); ld.style.display = ""; ld.textContent = "Načítám model…";
  const bin = Uint8Array.from(atob(GLB[ph]), c => c.charCodeAt(0)).buffer;
  new THREE.GLTFLoader().parse(bin, "", gltf => {
    root = gltf.scene;
    const box0 = new THREE.Box3().setFromObject(root), sz = box0.getSize(new THREE.Vector3());
    if (sz.z > sz.y * 1.05) root.rotation.x = -Math.PI / 2;      // Z-up export → Y-up view
    scene.add(root);
    const byName = new Map();
    root.traverse(o => {
      if (!o.isMesh) return;
      const n = nameOf(o);
      o.material = o.material.clone(); o.material.metalness = Math.min(o.material.metalness ?? 0, 0.3); o.material.roughness = 0.65;
      if (/^cell/.test(n)) { o.material.transparent = true; o.material.opacity = 0.55; o.material.depthWrite = false; }
      if (!byName.has(n)) byName.set(n, []); byName.get(n).push(o);
    });
    for (const [n, meshes] of byName) {
      const g = GROUPS.find(g => g[4](n)); if (!g) continue;
      parts.push({ name: n, meshes, group: g[0], base: meshes.map(m => m.material.color.clone()) });
    }
    const box = new THREE.Box3().setFromObject(root); box.getCenter(center); radius = box.getSize(new THREE.Vector3()).length() / 2;
    camera.near = radius / 200; camera.far = radius * 200; camera.updateProjectionMatrix();
    buildPivot(); document.getElementById("orb").hidden = !pivot; playing = false;
    document.getElementById("oPlay").textContent = "▶ Oběh kamery"; setOrbit(0);
    buildList(); view("iso"); ld.style.display = "none";
  }, err => { ld.textContent = "Model se nepodařilo načíst."; });
}
document.getElementById("phU").onclick = () => load("u");
document.getElementById("oPlay").onclick = e => { playing = !playing; e.currentTarget.setAttribute("aria-pressed", playing);
  e.currentTarget.textContent = playing ? "❚❚ Zastavit" : "▶ Oběh kamery"; };
document.getElementById("oAng").oninput = e => { playing = false; document.getElementById("oPlay").textContent = "▶ Oběh kamery"; setOrbit(+e.target.value); };
document.getElementById("phC").onclick = () => load("c");

function view(k) {
  const d = radius * 3.1 * Math.max(1, 0.9 / camera.aspect), c = center;
  const pos = { iso: [d * 0.62, d * 0.42, d * 0.68], front: [0, d * 0.05, d], side: [d, d * 0.05, 0], top: [0.001, d, 0] }[k];
  camera.position.set(c.x + pos[0], c.y + pos[1], c.z + pos[2]); controls.target.copy(c); controls.update();
}
for (const [id, k] of [["vIso", "iso"], ["vFront", "front"], ["vSide", "side"], ["vTop", "top"]]) document.getElementById(id).onclick = () => view(k);
document.getElementById("vAll").onclick = () => { for (const p of parts) p.meshes.forEach(m => m.visible = true); document.querySelectorAll(".gchk").forEach(c => c.checked = true); select(null); };

function select(p) {
  for (const q of parts) q.meshes.forEach((m, i) => { m.material.color.copy(q.base[i]); m.material.emissive && m.material.emissive.setHex(0x000000); });
  document.querySelectorAll(".parts button").forEach(b => b.classList.toggle("on", !!p && cz(b.dataset.n)[1] === cz(p.name)[1]));
  const info = document.getElementById("info");
  if (!p) { info.innerHTML = "<b>Klikněte na díl</b> v modelu nebo v seznamu – zvýrazní se a ukáže se, kde ho koupit."; return; }
  const hi = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--hi").trim() || "#e0790b");
  p.meshes.forEach(m => { m.material.color.copy(hi); if (m.material.emissive) m.material.emissive.copy(hi).multiplyScalar(0.25); });
  const g = GROUPS.find(g => g[0] === p.group);
  const c = cz(p.name), cnt = parts.filter(q => cz(q.name)[1] === c[1]).length;
  info.innerHTML = `<b>${c[1]}</b>${cnt > 1 ? ` <span class="m">· ${cnt} ks</span>` : ""}<br>${c[2] || g[2]}`;
}

function buildList() {
  const host = document.getElementById("groups");
  for (const g of GROUPS) {
    const items = parts.filter(p => p.group === g[0]);
    if (!items.length) continue;
    const uniq = new Map();
    for (const p of items) { const k = cz(p.name)[1]; if (!uniq.has(k)) uniq.set(k, [p, 0]); uniq.get(k)[1]++; }
    const div = document.createElement("div"); div.className = "grp";
    div.innerHTML = `<div class="ghead"><label><input type="checkbox" class="gchk" checked><span class="sw" style="background:${g[3]}"></span>${g[1]}</label></div><div class="who">${g[2]}</div>`;
    const ul = document.createElement("ul"); ul.className = "parts";
    for (const [k, [p, n]] of uniq) {
      const li = document.createElement("li"), b = document.createElement("button");
      b.textContent = n > 1 && !/^M /.test(p.name) ? `${k}  (${n}×)` : k; b.dataset.n = p.name;
      b.onclick = () => select(p); li.appendChild(b); ul.appendChild(li);
    }
    div.appendChild(ul); host.appendChild(div);
    div.querySelector("input").onchange = e => { items.forEach(p => p.meshes.forEach(m => m.visible = e.target.checked)); };
  }
}

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
canvas.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; });
canvas.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const r = canvas.getBoundingClientRect(); ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const vis = parts.flatMap(p => p.meshes.filter(m => m.visible));
  const hit = ray.intersectObjects(vis, false)[0];
  select(hit ? parts.find(p => p.meshes.includes(hit.object)) : null);
});
load("u");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
(function loop() { requestAnimationFrame(loop);
  if (playing && pivot) { let a = orbAng + orbDir * (reduce ? 2 : 0.6); if (a > 180 || a < -180) { orbDir *= -1; a = Math.max(-180, Math.min(180, a)); } setOrbit(a); }
  controls.update(); renderer.render(scene, camera); })();
</script>
