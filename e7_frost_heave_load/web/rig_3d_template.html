<title>Sestava E7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: workshop sheet – viewer left, parts list with suppliers right; stacks on phones */
:root {
  --bg: #eef1f2; --panel: #ffffff; --ink: #16202a; --ink-2: #55626e; --rule: #d3d9dd;
  --accent: #0f6f8f; --accent-soft: #dcecf2; --hi: #e0790b; --stage: #dfe5e8;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171c; --panel: #182129; --ink: #e6ecef; --ink-2: #9daab4; --rule: #2b3640;
    --accent: #5fb7d4; --accent-soft: #19323d; --hi: #f39a3a; --stage: #1b252d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171c; --panel: #182129; --ink: #e6ecef; --ink-2: #9daab4; --rule: #2b3640;
  --accent: #5fb7d4; --accent-soft: #19323d; --hi: #f39a3a; --stage: #1b252d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); margin: 0; }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 18px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { font: 600 22px/1.2 var(--f-body); margin: 0; text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 13px; }
.phase { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--panel); }
.phase button { font: 500 13px var(--f-body); color: var(--ink); background: transparent; border: 0; padding: 7px 12px; cursor: pointer; }
.phase button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.phase button + button { border-left: 1px solid var(--rule); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
.stage { position: relative; background: var(--stage); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden;
  height: min(80vh, 780px); min-height: 380px; max-width: 100%; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.bar { position: absolute; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.bar button, .chips button { font: 500 12px var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--rule);
  border-radius: 5px; padding: 5px 9px; cursor: pointer; }
.bar button:hover, .chips button:hover { border-color: var(--accent); }
.orb { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--rule); border-radius: 5px; padding: 2px 8px 2px 2px; font-size: 12px; }
.orb[hidden] { display: none; }
.orb button { border: 0; }
.orb input { width: 120px; vertical-align: middle; accent-color: var(--accent); }
.orb output { font: 12px var(--f-mono); display: inline-block; min-width: 3.2em; text-align: right; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.info { position: absolute; left: 10px; bottom: 10px; right: 10px; background: var(--panel); border: 1px solid var(--rule);
  border-radius: 6px; padding: 8px 10px; font-size: 13px; }
.info b { font-weight: 600; }
.info .m { font: 12px var(--f-mono); color: var(--ink-2); }
.load { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-2); font-size: 13px; }
aside { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 12px 6px; min-width: 0; }
aside h2 { font: 600 14px var(--f-body); margin: 0 0 6px; }
.grp { border-top: 1px solid var(--rule); padding: 8px 0; }
.grp:first-of-type { border-top: 0; }
.ghead { display: flex; align-items: center; gap: 8px; }
.ghead label { font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.who { color: var(--ink-2); font-size: 12px; margin: 2px 0 4px 26px; }
.parts { list-style: none; margin: 0; padding: 0 0 0 20px; display: grid; gap: 1px; }
.parts button { all: unset; display: block; width: 100%; box-sizing: border-box; padding: 3px 6px; border-radius: 4px; cursor: pointer;
  font-size: 12.5px; }
.parts button:hover { background: var(--accent-soft); }
.parts button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.parts button:focus-visible { outline: 2px solid var(--accent); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.fact { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; }
.fact .v { font: 600 16px var(--f-mono); font-variant-numeric: tabular-nums; }
.fact .l { color: var(--ink-2); font-size: 12px; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } .stage { height: min(75vh, 560px); } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="wrap">
  <header>
    <h1>Sestava E7</h1>

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 1, 10000);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;

bg(); matchMedia("(prefers-color-scheme: dark)").addEventListener("change", bg);

function nameOf(o) { while (o && o.parent) { if (/^E7/.test(o.parent.name || "")) return o.name.replace(/_/g, " "); o = o.parent; } return ""; }

let root = null, pivot = null, axis = null, playing = false, orbAng = 0, orbDir = 1;
const ROT = /^(P13 |P14 |P15 |Raspberry Pi Camera Module 3|LED white 1 W)/;
function setOrbit(deg) {
  orbAng = deg; document.getElementById("oAng").value = Math.round(deg); document.getElementById("oVal").textContent = Math.round(deg) + "°";
  if (pivot && axis) pivot.quaternion.setFromAxisAngle(axis, deg * Math.PI / 180);
}
function buildPivot() {
  pivot = null; axis = null;
  let asmNode = null; const nodes = [];
  root.traverse(o => { if (!asmNode && /^E7/.test(o.name || "") && o.children.length > 5) asmNode = o; });
  if (!asmNode) return;
  for (const c of [...asmNode.children]) if (ROT.test((c.name || "").replace(/_/g, " "))) nodes.push(c);
  if (!nodes.length) return;
  axis = new THREE.Vector3(0, 0, 1);                       // model z = sample axis (assembly node frame, origin on the axis)
  pivot = new THREE.Group(); asmNode.add(pivot);
  for (const n of nodes) pivot.attach(n);
}
function load(ph) {
  document.getElementById("phU").setAttribute("aria-pressed", ph === "u");
  document.getElementById("phC").setAttribute("aria-pressed", ph === "c");
  document.getElementById("sub").textContent = PHASE[ph].sub;
  document.getElementById("facts").innerHTML = PHASE[ph].facts.map(f => `<div class="fact"><div class="v">${f[0]}</div><div class="l">${f[1]}</div></div>`).join("");
  if (root) { scene.remove(root); root = null; }
  parts.length = 0; document.getElementById("groups").innerHTML = ""; select(null);
  const ld = document.getElementById("load"); ld.style.display = ""; ld.textContent = "Načítám model…";
  const bin = Uint8Array.from(atob(GLB[ph]), c => c.charCodeAt(0)).buffer;
  new THREE.GLTFLoader().parse(bin, "", gltf => {
    root = gltf.scene;
    const box0 = new THREE.Box3().setFromObject(root), sz = box0.getSize(new THREE.Vector3());
    if (sz.z > sz.y * 1.05) root.rotation.x = -Math.PI / 2;      // Z-up export → Y-up view
    scene.add(root);
    const byName = new Map();
    root.traverse(o => {
      if (!o.isMesh) return;
      const n = nameOf(o);
      o.material = o.material.clone(); o.material.metalness = Math.min(o.material.metalness ?? 0, 0.3); o.material.roughness = 0.65;
      if (/^cell/.test(n)) { o.material.transparent = true; o.material.opacity = 0.55; o.material.depthWrite = false; }
      if (!byName.has(n)) byName.set(n, []); byName.get(n).push(o);
    });
    for (const [n, meshes] of byName) {
      const g = GROUPS.find(g => g[4](n)); if (!g) continue;
      parts.push({ name: n, meshes, group: g[0], base: meshes.map(m => m.material.color.clone()) });
    }
    const box = new THREE.Box3().setFromObject(root); box.getCenter(center); radius = box.getSize(new THREE.Vector3()).length() / 2;
    camera.near = radius / 200; camera.far = radius * 200; camera.updateProjectionMatrix();
    buildPivot(); document.getElementById("orb").hidden = !pivot; playing = false;
    document.getElementById("oPlay").textContent = "▶ Oběh kamery"; setOrbit(0);
    buildList(); view("iso"); ld.style.display = "none";
  }, err => { ld.textContent = "Model se nepodařilo načíst."; });
}
document.getElementById("phU").onclick = () => load("u");
document.getElementById("oPlay").onclick = e => { playing = !playing; e.currentTarget.setAttribute("aria-pressed", playing);
  e.currentTarget.textContent = playing ? "❚❚ Zastavit" : "▶ Oběh kamery"; };
document.getElementById("oAng").oninput = e => { playing = false; document.getElementById("oPlay").textContent = "▶ Oběh kamery"; setOrbit(+e.target.value); };
document.getElementById("phC").onclick = () => load("c");

function view(k) {
  const d = radius * 3.1 * Math.max(1, 0.9 / camera.aspect), c = center;
  const pos = { iso: [d * 0.62, d * 0.42, d * 0.68], front: [0, d * 0.05, d], side: [d, d * 0.05, 0], top: [0.001, d, 0] }[k];
  camera.position.set(c.x + pos[0], c.y + pos[1], c.z + pos[2]); controls.target.copy(c); controls.update();
}
for (const [id, k] of [["vIso", "iso"], ["vFront", "front"], ["vSide", "side"], ["vTop", "top"]]) document.getElementById(id).onclick = () => view(k);
document.getElementById("vAll").onclick = () => { for (const p of parts) p.meshes.forEach(m => m.visible = true); document.querySelectorAll(".gchk").forEach(c => c.checked = true); select(null); };

function select(p) {
  for (const q of parts) q.meshes.forEach((m, i) => { m.material.color.copy(q.base[i]); m.material.emissive && m.material.emissive.setHex(0x000000); });
  document.querySelectorAll(".parts button").forEach(b => b.classList.toggle("on", !!p && cz(b.dataset.n)[1] === cz(p.name)[1]));
  const info = document.getElementById("info");
  if (!p) { info.innerHTML = "<b>Klikněte na díl</b> v modelu nebo v seznamu – zvýrazní se a ukáže se, kde ho koupit."; return; }
  const hi = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--hi").trim() || "#e0790b");
  p.meshes.forEach(m => { m.material.color.copy(hi); if (m.material.emissive) m.material.emissive.copy(hi).multiplyScalar(0.25); });
  const g = GROUPS.find(g => g[0] === p.group);
  const c = cz(p.name), cnt = parts.filter(q => cz(q.name)[1] === c[1]).length;
  info.innerHTML = `<b>${c[1]}</b>${cnt > 1 ? ` <span class="m">· ${cnt} ks</span>` : ""}<br>${c[2] || g[2]}`;
}

function buildList() {
  const host = document.getElementById("groups");
  for (const g of GROUPS) {
    const items = parts.filter(p => p.group === g[0]);
    if (!items.length) continue;
    const uniq = new Map();
    for (const p of items) { const k = cz(p.name)[1]; if (!uniq.has(k)) uniq.set(k, [p, 0]); uniq.get(k)[1]++; }
    const div = document.createElement("div"); div.className = "grp";
    div.innerHTML = `<div class="ghead"><label><input type="checkbox" class="gchk" checked><span class="sw" style="background:${g[3]}"></span>${g[1]}</label></div><div class="who">${g[2]}</div>`;
    const ul = document.createElement("ul"); ul.className = "parts";
    for (const [k, [p, n]] of uniq) {
      const li = document.createElement("li"), b = document.createElement("button");
      b.textContent = n > 1 && !/^M /.test(p.name) ? `${k}  (${n}×)` : k; b.dataset.n = p.name;
      b.onclick = () => select(p); li.appendChild(b); ul.appendChild(li);
    }
    div.appendChild(ul); host.appendChild(div);
    div.querySelector("input").onchange = e => { items.forEach(p => p.meshes.forEach(m => m.visible = e.target.checked)); };
  }
}

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
canvas.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; });
canvas.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const r = canvas.getBoundingClientRect(); ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const vis = parts.flatMap(p => p.meshes.filter(m => m.visible));
  const hit = ray.intersectObjects(vis, false)[0];
  select(hit ? parts.find(p => p.meshes.includes(hit.object)) : null);
});
load("u");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
(function loop() { requestAnimationFrame(loop);
  if (playing && pivot) { let a = orbAng + orbDir * (reduce ? 2 : 0.6); if (a > 180 || a < -180) { orbDir *= -1; a = Math.max(-180, Math.min(180, a)); } setOrbit(a); }
  controls.update(); renderer.render(scene, camera); })();
</script>
